name: Monthly LDA Production Redeploy Keepalive

on:
  schedule:
    - cron: "0 3 1-7 * 1"
  workflow_dispatch:

concurrency:
  group: monthly-lda-production-redeploy
  cancel-in-progress: false

jobs:
  redeploy:
    name: Redeploy and verify current production release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Redeploy current production release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@54.13.0 redeploy ldrivingacademy.co.uk \
            --target production \
            --scope team_tKtLsQdt8Omu58bqTcpTCt8r \
            --non-interactive \
            > /tmp/lda-deployment-url.txt
          tail -n 1 /tmp/lda-deployment-url.txt | tr -d '\r\n' > /tmp/lda-deployment-url-clean.txt
          echo "DEPLOYMENT_URL=$(cat /tmp/lda-deployment-url-clean.txt)" >> "$GITHUB_ENV"

      - name: Confirm Vercel deployment is ready
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$DEPLOYMENT_URL"
          npx --yes vercel@54.13.0 inspect "$DEPLOYMENT_URL" \
            --scope team_tKtLsQdt8Omu58bqTcpTCt8r \
            --non-interactive

      - name: Verify live website
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 10 --retry-all-errors \
            --output /tmp/lda-homepage.html \
            https://ldrivingacademy.co.uk/
          grep -q "Book Driving Lessons Near You | LDA" /tmp/lda-homepage.html
          curl --fail --silent --show-error --location \
            https://ldrivingacademy.co.uk/robots.txt \
            --output /tmp/lda-robots.txt

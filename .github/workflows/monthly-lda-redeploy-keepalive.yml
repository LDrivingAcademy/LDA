name: Monthly LDA Production Redeploy Keepalive

on:
  schedule:
    - cron: "0 3 1-7 * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-lda-production-redeploy
  cancel-in-progress: false

jobs:
  redeploy:
    name: Redeploy and verify current production release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Redeploy current production release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          TEAM_ID="team_tKtLsQdt8Omu58bqTcpTCt8r"
          SOURCE_DEPLOYMENT_ID="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/ldrivingacademy.co.uk?teamId=$TEAM_ID" \
            | jq --raw-output '.id')"
          test -n "$SOURCE_DEPLOYMENT_ID"
          test "$SOURCE_DEPLOYMENT_ID" != "null"

          REDEPLOYMENT="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"deploymentId\":\"$SOURCE_DEPLOYMENT_ID\",\"meta\":{\"action\":\"redeploy\"},\"name\":\"lda\",\"target\":\"production\"}" \
            "https://api.vercel.com/v13/deployments?forceNew=1&teamId=$TEAM_ID")"
          DEPLOYMENT_ID="$(printf '%s' "$REDEPLOYMENT" | jq --raw-output '.id')"
          DEPLOYMENT_URL="$(printf '%s' "$REDEPLOYMENT" | jq --raw-output '.url')"
          test -n "$DEPLOYMENT_ID"
          test "$DEPLOYMENT_ID" != "null"
          test -n "$DEPLOYMENT_URL"
          test "$DEPLOYMENT_URL" != "null"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_URL=https://$DEPLOYMENT_URL" >> "$GITHUB_ENV"

      - name: Confirm Vercel deployment is ready
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TEAM_ID="team_tKtLsQdt8Omu58bqTcpTCt8r"
          for attempt in $(seq 1 60); do
            STATE="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$TEAM_ID" \
              | jq --raw-output '.readyState')"
            if [ "$STATE" = "READY" ]; then
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "Vercel deployment ended in state: $STATE" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Vercel deployment to become ready." >&2
          exit 1

      - name: Verify live website
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 10 --retry-all-errors \
            --output /tmp/lda-homepage.html \
            https://ldrivingacademy.co.uk/
          grep -q "Book Driving Lessons Near You | LDA" /tmp/lda-homepage.html
          curl --fail --silent --show-error --location \
            https://ldrivingacademy.co.uk/robots.txt \
            --output /tmp/lda-robots.txt

      - name: Alert LDA when Vercel authentication or redeployment fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="LDA cloud redeploy needs authentication or attention"
          EXISTING_NUMBER="$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --search "$TITLE in:title" \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")"
          MESSAGE="@LDrivingAcademy The monthly LDA production redeploy failed. Vercel may require token renewal or account re-authentication. Review the failed run, replace the encrypted VERCEL_TOKEN secret if needed, rerun the workflow, and confirm the live website before closing this alert. Run: $RUN_URL"

          if [ -n "$EXISTING_NUMBER" ]; then
            gh issue comment "$EXISTING_NUMBER" --repo "$REPOSITORY" --body "$MESSAGE"
          else
            gh issue create \
              --repo "$REPOSITORY" \
              --assignee "LDrivingAcademy" \
              --title "$TITLE" \
              --body "$MESSAGE"
          fi

name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:monitor
      - run: npm run build
